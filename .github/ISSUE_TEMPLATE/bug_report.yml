name: Bug 报告
description: 实际行为与文档或预期不符
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿粘贴真实凭证、token 或隐私数据。
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 清楚描述发生了什么。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 发行版 tag、npm 版本或 commit SHA。
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境
      placeholder: |
        操作系统：
        运行时版本：
        安装方式：
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 请先脱敏路径、token 与个人信息。
      render: text
